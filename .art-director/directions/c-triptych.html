<link rel="stylesheet" href="base.css">
<style>
body{background:var(--coal)}
.hero{position:relative;height:100vh;min-height:640px;overflow:hidden;padding:84px 12px 12px;display:grid;grid-template-rows:1fr auto}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0}
.reel{position:relative;border-radius:22px;overflow:hidden;background:#000}
.reel:nth-child(2){transform:translateY(-6%)}
.reel video{width:100%;height:100%;object-fit:cover}
.reel span{position:absolute;left:14px;bottom:12px;font-family:Unbounded;font-weight:700;font-size:13px;background:#fff;color:#000;padding:6px 10px;border-radius:8px}
.over{position:absolute;left:0;right:0;top:50%;transform:translateY(-38%);text-align:center;z-index:3;pointer-events:none}
h1{font-size:clamp(46px,8.8vw,160px);text-shadow:0 10px 60px rgba(0,0,0,.55)}
.over .dline{width:min(40vw,520px);margin:18px auto 0}
.bar{display:flex;align-items:center;gap:20px;padding:16px 8px 4px}
.ticker{flex:1;overflow:hidden;white-space:nowrap;font-family:Unbounded;font-weight:700;font-size:20px;color:rgba(255,255,255,.88)}
.ticker b{color:var(--yellow);margin:0 14px}
@media(max-width:760px){.hero{padding:72px 8px 8px}.reels{grid-template-columns:1fr 1fr;gap:8px}.reel:nth-child(3){display:none}.bar{flex-direction:column;align-items:stretch}.ticker{font-size:15px}.btn{justify-content:center}h1{font-size:14vw}}
</style></head><body>
